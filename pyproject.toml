[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-continual-marl"
version = "0.1.0"
description = "Continual Multi-Agent Workflow Orchestration (Manager Agent) — FYP CCDS26-0710"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Placeholders mirroring external/manager_agent_gym/pyproject.toml —
    # keep in sync with that submodule as it evolves.
    "fastapi[standard]>=0.115.7",
    "numpy>=2.1.3",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "rich>=13.9.4",
    "tqdm>=4.66.5",
    "typer>=0.12.5",
    "matplotlib>=3.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.5",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
]

# Optional provider groups, mirroring manager_agent_gym's own groups
# (install with: uv sync --group <name>)
openai = [
    "openai>=1.58.0",
    "instructor>=1.11.3",
]
anthropic = [
    "anthropic>=0.68.0",
    "instructor>=1.11.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
